[project]
name = "augur"
version = "0.0.0"
description = "Local-first, LLM-powered personal investment research workbench"
requires-python = ">=3.13"
# NOTE: dependencies are intentionally unpinned here and will be added/locked at
# M1 via `uv add ...` (see backend/README.md). This manifest exists so the
# project structure is real; `uv sync` becomes meaningful once deps are added.
dependencies = [
    "apscheduler>=3.11.2",
    "fastapi>=0.136.3",
    "finance-datareader>=0.9.202",
    "httpx>=0.28.1",
    "pyarrow>=24.0.0",
    "pydantic-settings>=2.14.1",
    "pykrx>=1.2.8",
    "uvicorn[standard]>=0.48.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["augur"]
