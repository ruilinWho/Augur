[project]
name = "augur"
version = "0.0.0"
description = "Local-first, LLM-powered personal investment research workbench"
requires-python = ">=3.13"
# NOTE: dependencies are intentionally unpinned here and will be added/locked at
# M1 via `uv add ...` (see backend/README.md). This manifest exists so the
# project structure is real; `uv sync` becomes meaningful once deps are added.
dependencies = [
    "akshare>=1.18.64",
    "apscheduler>=3.11.2",
    "fastapi>=0.136.3",
    "feedparser>=6.0.12",
    "finance-datareader>=0.9.202",
    "httpx>=0.28.1",
    "litellm>=1.86.2",
    "pyarrow>=24.0.0",
    "pydantic-settings>=2.14.1",
    "pykrx>=1.2.8",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.48.0",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.pytest.ini_options]
# 只在 tests/ 里找测试——否则 bare `uv run pytest` 会误收集 augur/news/source_test.py::test_source
# （那是 app 内的探活函数、非 pytest 测试，会因缺 'id' fixture 报错）
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["augur"]
