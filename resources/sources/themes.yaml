# 主题分类关键词（news/classify.py 用）——版本化、主人可编辑（加新词无需改码）。
# 规则：对每条新闻的「标题 + 摘要」做大小写无关的子串匹配；命中的主题进 topics（多标签）。
# theme（单值主类）取命中里**优先级最高**的（下面 themes 的书写顺序即优先级，前沿方向在前）；
# 都没命中则回退到该信源在 feeds.yaml 里的 category，再不行就 other。
# 用途：把泛 tech/markets/world 源里的前沿内容（如 CNBC 讲英伟达）正确归到 chips/ai。

