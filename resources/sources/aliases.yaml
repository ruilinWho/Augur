# 跨语言别名种子（curated，版本化输入 → resources/）。
#
# 为什么需要它：免费列表源的名字是单语的——FDR 美/中股是英文名、韩股是韩文名；
# akshare 能补 A 股中文名，但港股（eastmoney）在本机偶发被代理拦截。
# 于是「搜 海力士 → 韩国 SK 海力士」这类跨语言检索，只能靠这张人工维护的别名表兜底。
#
# 字段：
#   symbol : 归一化 MARKET:CODE（必填）
#   cn     : 中文显示名（可选）——命中别名但目录里只有外文名时，前端展示这个
#   names  : 可搜索别名（中文/拼音/英文/韩文皆可），会并入该标的的检索文本
#
# 维护：只增不改地往下加；保持精炼、高频优先。目录里已有中文名的 A 股一般无需登记。

